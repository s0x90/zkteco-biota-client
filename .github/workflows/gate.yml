# Reusable gate, called by every workflow that runs on the self-hosted
# runner. Defined once so that the callers cannot disagree about it.
#
# What this job is: a loud, red signal for pull requests from forks, and the
# approval mechanism for automated dependency bumps (the ci-approved label).
#
# What this job is NOT: a security boundary. On the pull_request event the
# workflow files, this one included, are read from the pull request itself,
# so a fork can edit or remove this gate. The controls that actually keep
# untrusted code off the self-hosted runner are repository settings, and
# they must be in place before this repository is ever made public:
#
#   Settings -> Actions -> General -> Fork pull request workflows:
#     "Require approval for all external contributors"
#
# The runner is registered to this repository only. Never share it with a
# public repository. See "CI and the self-hosted runner" in the README.
name: Trusted source

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # This job has no checkout, so nothing from the pull request runs here. It
  # fails rather than skips because branch protection counts a skipped
  # required check as satisfied. Every other job depends on it, so a job that
  # forgets its own condition is still gated.
  gate:
    name: Trusted source
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    steps:
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks are not run on self-hosted runners. Push the branch into this repository to test it."
          exit 1

      # Keyed on the PR author, not github.actor: the actor is whoever caused
      # the event, which after "opened" is usually a human adding a label or
      # pushing a fixup, and that must not count as approval.
      - name: Refuse unreviewed automated bumps
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'ci-approved')
        run: |
          echo "::error::Dependency bumps run only after a maintainer has read the release notes and added the ci-approved label."
          exit 1

      - run: echo "trusted source, proceeding"
