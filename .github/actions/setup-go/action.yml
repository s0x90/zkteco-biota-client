name: Set up Go for this repository
description: >-
  Installs the Go toolchain named by the go directive in go.mod, resolved to
  its latest patch release, so the version lives in exactly one place.
  Caching is off because the module has no dependencies and therefore no
  go.sum, which setup-go requires to key its cache; the self-hosted runner's
  own module cache persists between jobs anyway.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
